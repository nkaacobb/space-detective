[package]
name = "space-detective"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Scan a folder and see what takes up the space, as a treemap"

[dependencies]
eframe = { version = "0.32", features = ["persistence"] }
rfd = "0.15"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rodio = { version = "0.21", default-features = false, features = ["playback", "vorbis"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Folder listings with file ids, so the same data reached by two paths is only counted once.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[build-dependencies]
# Puts the icon and version details into the Windows .exe (does nothing on other platforms).
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
